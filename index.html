    <script>
      (function () {
        try {
          var currentFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : undefined;
          var makeFetchWritable = function (target) {
            if (!target) return;
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (!desc || desc.configurable) {
              Object.defineProperty(target, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return currentFetch;
                },
                set: function (fn) {
                  if (typeof fn === 'function') {
                    currentFetch = fn;
                  }
                },
              });
            }
          };
          makeFetchWritable(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            makeFetchWritable(Window.prototype);
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            var filename = (event && event.filename) || '';
            var message = (event && event.message) || '';
            if (
              filename.indexOf('chrome-extension://') === 0 ||
              filename.indexOf('moz-extension://') === 0 ||
              filename.indexOf('@vite/client') !== -1 ||
              message.indexOf('Cannot set property fetch') !== -1 ||
              message.indexOf('WebSocket closed without opened') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = (reason && (reason.message || String(reason))) || '';
            if (
              msg.indexOf('WebSocket closed without opened') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
